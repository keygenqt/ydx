[package]
name = "ydx_auroraos"
version.workspace = true
edition.workspace = true

[lib]
name = "ydx_auroraos"
crate-type = ["lib", "staticlib"]

[dependencies]
ydx_core = { path = "../ydx_core", features = ["sffi"] }
safer-ffi.workspace = true

[features]
headers = ["safer-ffi/headers"]
default = ["ffi"]
ffi = []

# Safer FFI
[[bin]]
name = "ydx_auroraos-headers"
required-features = ["headers"]
