[package]
name = "ydx-wasm"
edition = "2024"
version = "0.0.1"

[lib]
name = "ydx_wasm"
crate-type = ["lib", "cdylib"]

[dependencies]
ydx-core = { path = "../ydx_core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1.1"
web-sys = { version = "0.3", features = ["console"] }
