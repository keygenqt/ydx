[package]
name = "ydx_linux"
version.workspace = true
edition.workspace = true

[dependencies]
ydx_core = { path = "../ydx_core", features = ["sffi"] }
safer-ffi.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
headers = ["safer-ffi/headers"]
default = ["ffi"]
ffi = []

# Safer FFI
[[bin]]
name = "ydx_linux-headers"
required-features = ["headers"]
