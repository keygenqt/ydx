[package]
name = "shared"
edition = "2024"
version = "0.0.1"

[lib]
name = "shared"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-time = "1.1"
jni = "0.21.1"
safer-ffi = "0.1.13"

# Safer FFI
[[bin]]
name = "shared-headers"
required-features = ["headers"]

[features]
headers = ["safer-ffi/headers"]

# Cross
[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
image = "ubuntu:23.10"
pre-build = [
    "sed -i -re 's/([a-z]{2}.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list",
    "apt-get update && apt-get -y install ssh build-essential clang pkg-config",
]

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
image = "ubuntu:23.10"
pre-build = [
    "sed -i -re 's/([a-z]{2}.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list",
    "apt-get update && apt-get -y install ssh build-essential clang pkg-config g++-aarch64-linux-gnu",
]
