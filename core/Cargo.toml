[workspace]
resolver = "2"
members = [
    "ydx_core",
    "ydx_android",
    "ydx_auroraos",
    "ydx_harmonyos",
    "ydx_ios",
    "ydx_linux",
    "ydx_macos",
    "ydx_windows",
    "ydx_wasm",
]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.21"
serde_json = "1.0"
async-trait = "0.1.89"
# FFI
tokio = { version = "1.5", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["json"] }
safer-ffi = "0.1.13"
# WASM
js-sys = "0.3"
gloo-net = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }

# Build options
[profile.dev]
lto = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"

# Cross Aurora OS
[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
image = "ubuntu:23.10"
pre-build = [
    "sed -i -re 's/([a-z]{2}.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list",
    "apt-get update && apt-get -y install ssh build-essential clang pkg-config",
]

[workspace.metadata.cross.target.armv7-unknown-linux-gnueabihf]
image = "ubuntu:23.10"
pre-build = [
    "sed -i -re 's/([a-z]{2}.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list",
    "apt-get update && apt-get -y install ssh build-essential clang pkg-config gcc-arm-linux-gnueabihf",
]

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
image = "ubuntu:23.10"
pre-build = [
    "sed -i -re 's/([a-z]{2}.)?archive.ubuntu.com|security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list",
    "apt-get update && apt-get -y install ssh build-essential clang pkg-config g++-aarch64-linux-gnu",
]
