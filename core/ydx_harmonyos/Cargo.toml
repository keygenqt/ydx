[package]
name = "ydx-harmonyos"
edition = "2024"
version = "0.0.1"

[lib]
name = "ydx_harmonyos"
crate-type = ["lib", "cdylib"]

[dependencies]
ydx-core = { path = "../ydx_core" }
safer-ffi = "0.1.13"

# Safer FFI
[[bin]]
name = "ydx_harmonyos-headers"
required-features = ["headers"]

[features]
headers = ["safer-ffi/headers"]
