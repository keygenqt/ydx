name: ydx-server

services:
  # Build
  build:
    container_name: ydx-build
    image: rust:1.93.0-bookworm
    command:
      - /bin/bash
      - -c
      - |
        ################################
        ## Build project ydx
        ################################
        cargo build --release

        ################################
        ## Create app config from .env
        ################################
        cat > target/release/application.conf <<EOF
        server {
          development = false
          secret = ${API_SECRET}
        }
        deployment {
          host = 0.0.0.0
          port = 3000
        }
        postgres {
          url = "postgres://postgres:5432/${POSTGRES_DB}"
          user = "${POSTGRES_USER}"
          password = "${POSTGRES_PASSWORD}"
        }
        EOF

        ################################
        ## Create connect config pgadmin
        ################################
        cat > target/release/pgadmin_servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "My Local PostgresSQL Database",
              "Group": "Servers",
              "Host": "postgres",
              "Port": 5432,
              "MaintenanceDB": "${POSTGRES_DB}",
              "Username": "${POSTGRES_USER}",
              "SSLMode": "prefer",
              "Comment": "Automatically connected server via Docker Compose."
            }
          }
        }
        EOF
    working_dir: /var/www
    volumes:
      - ../:/var/www

  # Db run
  postgres:
    container_name: ydx-postgres
    image: postgres:18.1-alpine
    depends_on:
      build:
        condition: service_completed_successfully
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # pgAdmin run
  pgadmin:
    container_name: ydx-pgadmin
    image: dpage/pgadmin4:9.11.0
    depends_on:
      postgres:
        condition: service_healthy
      build:
        condition: service_completed_successfully
    restart: always
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ../target/release/pgadmin_servers.json:/pgadmin4/servers.json
    networks:
      - internal

  # API server run
  run:
    container_name: ydx-run
    image: rust:1.93.0-bookworm
    depends_on:
      postgres:
        condition: service_started
      build:
        condition: service_completed_successfully
    restart: always
    command:
      - /bin/bash
      - -c
      - |
        ################################
        ## Import users to API
        ################################
        ./ydx tools --config application.conf --users /var/project/data/users.json

        ################################
        ## Run API server
        ################################
        ./ydx start --config application.conf
    ports:
      - ${API_PORT}:3000
    working_dir: /var/www/target/release
    volumes:
      - ../../:/var/project
      - ../:/var/www
      - ../migrations:/var/www/target/release/migrations
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  ydx-postgres:
