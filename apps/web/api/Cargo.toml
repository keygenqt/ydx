[package]
name = "ydx-server"
version = "0.0.1"
edition = "2024"

[profile.release]
strip = "symbols"
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie-private", "multipart"] }
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
webp = "0.3.1"
uuid = { version = "1.21", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["normalize-path"] }
validator = { version = "0.20", features = ["derive"] }
regex = "1.12.3"
time = "0.3.46"
colored = "3.1.1"
tokio = { version = "1.49", features = ["full"] }
clap = { version = "4.5.54", features = ["derive"] }
clap-cargo = "0.18.3"
chrono = "0.4.43"
serde_with = { version = "3.16", features = ["chrono"] }
diesel = { version = "2.3", features = ["serde_json", "chrono"] }
diesel-async = { version = "0.7", features = ["postgres", "bb8", "migrations"] }
diesel_migrations = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
hocon-rs = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.10.0"
