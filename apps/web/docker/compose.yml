name: ydx-services

services:
  rust:
    container_name: ydx-build-rust
    image: rust:1.93.0-bookworm
    command:
      - /bin/bash
      - -c
      - |
        # Init configs
        apps/web/docker/scripts/init.sh

        # Build core
        core/scripts/web/build.sh

        # Build api
        cargo build --manifest-path apps/web/api/Cargo.toml --release

        # Build docs
        cargo install mdbook@0.5.2
        mdbook build apps/web/docs
    working_dir: /var/www
    volumes:
      - ../../../:/var/www

  node:
    container_name: ydx-build-node
    image: node:25.2.1
    depends_on:
      rust:
        condition: service_completed_successfully
    command:
      - /bin/bash
      - -c
      - |
        # Build web application
        cd apps/web/app
        npm install
        npm run build
    working_dir: /var/www
    volumes:
      - ../../../:/var/www

  postgres:
    container_name: ydx-postgres
    image: postgres:18.1-alpine
    depends_on:
      node:
        condition: service_completed_successfully
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  pgadmin:
    container_name: ydx-pgadmin
    image: dpage/pgadmin4:9.12.0
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_completed_successfully
    restart: always
    ports:
      - ${PGADMIN_PORT}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./configs/pgadmin.json:/pgadmin4/servers.json
    networks:
      - internal

  api:
    container_name: ydx-api
    image: rust:1.93.0-bookworm
    depends_on:
      postgres:
        condition: service_started
      node:
        condition: service_completed_successfully
    restart: always
    command:
      - /bin/bash
      - -c
      - api/target/release/ydx-server start --config docker/configs/api.conf
    working_dir: /var/www
    volumes:
      - ../:/var/www
    networks:
      - internal
    expose:
      - ${API_PORT}

  nginx:
    container_name: ydx-proxy
    image: nginx:1.28-alpine3.23
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_started
      node:
        condition: service_completed_successfully
    restart: always
    ports:
      - ${APP_PORT}:${APP_PORT}
    working_dir: /var/www
    volumes:
      - ../:/var/www
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  ydx-postgres:
