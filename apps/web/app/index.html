<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YDX</title>
    <meta property="og:title" content="YDX" />
    <meta property="og:description" content="YDX website." />
    <meta property="og:image" content="/logo192.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #root {
        background: #fefefc;
        display: table;
        width: 100%;
        height: 100%;
      }
      .bg-index {
        display: table-cell;
        vertical-align: middle;
        text-align: center;
        width: 100%;
        height: 100%;
      }
      .bg-index img {
        width: 120px;
        padding: 20px;
        border-radius: 50%;
        border: 4px solid;
        border-color: #0b1e02;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root" class="ScrollSection">
      <!-- `/logo192.png`- using like filter for publications -->
      <div class="bg-index">
        <img id="logo" src="/logo192.png" alt="YDX" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<script>
  if (localStorage.getItem("darkModeKey") == "true") {
    document.body.style.background = "#141414";
    document.getElementById("logo").style.background = "#000000";
    document.getElementById("logo").style.borderColor = "#8FC765";
  }
</script>
